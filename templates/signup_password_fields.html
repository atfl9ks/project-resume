<div id="signupPasswordTools">
  <label class="password-field">Пароль
    <span class="password-input-wrap">
      <input id="signupPasswordBox" data-password-input name="password1" type="password" autocomplete="new-password" placeholder="Мінімум 8 символів" aria-describedby="passwordStrengthHint passwordRequirements" required>
      <button class="password-visibility" type="button" data-toggle-password aria-label="Показати пароль" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path data-eye-slash d="m4 4 16 16"/></svg></button>
    </span>
  </label>
  {% include "password_meter.html" %}
  <label id="confirmPassword" class="password-field">Повторіть пароль
    <span class="password-input-wrap">
      <input id="signupPasswordConfirm" data-password-confirm name="password2" type="password" autocomplete="new-password" aria-describedby="passwordMatchFeedback" required>
      <button class="password-visibility" type="button" data-toggle-password aria-label="Показати пароль" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="3"/><path data-eye-slash d="m4 4 16 16"/></svg></button>
    </span>
    <small class="password-match-feedback" id="passwordMatchFeedback" data-password-match role="status" aria-live="polite"></small>
  </label>
</div>
