<div class="password-meter" data-password-meter>
  <div class="password-meter-heading"><span data-strength-label>Додайте пароль</span><span data-strength-value>0 / 5</span></div>
  <div class="password-meter-track" data-strength-track role="progressbar" aria-label="Надійність пароля" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0">
    <span data-meter-segment></span><span data-meter-segment></span><span data-meter-segment></span><span data-meter-segment></span><span data-meter-segment></span>
  </div>
  <p class="password-strength-hint" data-strength-hint aria-live="polite">Додайте більше символів, щоб оцінити надійність.</p>
  <ul class="password-requirements" id="passwordRequirements">
    <li data-password-rule="length"><span class="requirement-icon" aria-hidden="true">○</span><span>Мінімум 8 символів</span></li>
    <li data-password-rule="upper"><span class="requirement-icon" aria-hidden="true">○</span><span>Велика літера (A–Z)</span></li>
    <li data-password-rule="lower"><span class="requirement-icon" aria-hidden="true">○</span><span>Мала літера (a–z)</span></li>
    <li data-password-rule="digit"><span class="requirement-icon" aria-hidden="true">○</span><span>Цифра (0–9)</span></li>
    <li data-password-rule="special"><span class="requirement-icon" aria-hidden="true">○</span><span>Спеціальний символ (!@#$…)</span></li>
  </ul>
</div>
