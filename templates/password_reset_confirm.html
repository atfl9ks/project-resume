{% load static %}<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Новий пароль — Резюме</title><link rel="stylesheet" href="{% static 'resume/styles.css' %}"><link rel="stylesheet" href="{% static 'resume/dark-premium.css' %}?v=19"></head><body class="auth-page"><main class="wrap auth-page-main"><section class="auth-dialog auth-page-card"><h1>Створіть новий пароль</h1>{% if validlink %}<form method="post">{% csrf_token %}{% for field in form %}<label class="form-field">{{ field.label }}{{ field }}{% for error in field.errors %}<small class="field-error">{{ error }}</small>{% endfor %}</label>{% endfor %}<button class="btn btn-primary auth-submit" type="submit">Зберегти пароль</button></form>{% else %}<p>Посилання недійсне або вже використане. Запросіть нове.</p><a class="btn btn-primary auth-submit" href="{% url 'password_reset' %}">Нове посилання</a>{% endif %}</section></main></body></html>
